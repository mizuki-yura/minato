[package]
name = "minato"
version = "0.1.2"
edition = "2021"
license = "MIT"

# SSP向けDLLとして出力
# rlibはsrc/bin配下のCLIツールやtests/配下の結合テストからlibをuseするために必要
[lib]
name = "minato"
crate-type = ["cdylib", "rlib"]

[features]
# CLI構文チェッカー minato_check をビルドする（cargo build --features cli --bin minato_check）
cli = ["dep:ariadne"]

[[bin]]
name = "minato_check"
path = "src/bin/minato_check.rs"
required-features = ["cli"]

# minato_checkバイナリを起動する結合テスト（cargo test --features cli）
[[test]]
name = "minato_check"
path = "tests/minato_check.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0
[dependencies]

# パーサー
chumsky = { version = "0.10", default-features = false }
chrono = "0.4"
# config.toml読み込み
toml = "0.8"

indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

# セーブデータ（JSON）
serde_json = "1"

# Cargo.toml
regex = "1"

# Windows GlobalAlloc/GlobalFree
# consoleapi/processenv/wincon は minato_check がコンソールの色表示（VTモード）を有効にするために使う
winapi = { version = "0.3", features = ["winbase", "minwindef", "consoleapi", "processenv", "wincon"] }
# minato_check（CLI）専用。本体DLLには入れないため feature "cli" でのみ有効にする
ariadne = { version = "0.6.0", default-features = false, optional = true }
# グローバル状態管理
once_cell = "1"
encoding_rs = "0.8"

[profile.test]
opt-level = 1

[profile.release]
# DLLサイズ削減
opt-level = "z"       # サイズ優先最適化
lto = true            # リンク時最適化
codegen-units = 1
strip = true          # シンボル削除
# panic = "abort"にするとcatch_unwind(lib.rs各所)が機能せず、
# パニックが即プロセスabort(SSP本体ごと落ちる)になるため"unwind"のまま維持
panic = "unwind"
