[package]
name = "minato"
version = "0.1.0"
edition = "2021"
license = "MIT"

# SSP向けDLLとして出力
[lib]
name = "minato"
crate-type = ["cdylib"]

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0
[dependencies]

# パーサー
chumsky = { version = "0.10", default-features = false }
chrono = "0.4"
# config.toml読み込み
toml = "0.8"

indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

# セーブデータ（JSON）
serde_json = "1"

# Cargo.toml
regex = "1"

# Windows GlobalAlloc/GlobalFree
winapi = { version = "0.3", features = ["winbase", "minwindef"] }
ariadne = { version = "0.6.0", default-features = false }
# グローバル状態管理
once_cell = "1"
encoding_rs = "0.8"

[profile.test]
opt-level = 1

[profile.release]
# DLLサイズ削減
opt-level = "z"       # サイズ優先最適化
lto = true            # リンク時最適化
codegen-units = 1
strip = true          # シンボル削除
# panic = "abort"にするとcatch_unwind(lib.rs各所)が機能せず、
# パニックが即プロセスabort(SSP本体ごと落ちる)になるため"unwind"のまま維持
panic = "unwind"
